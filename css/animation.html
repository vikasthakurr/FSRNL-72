<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* ============================================
           CSS ANIMATION NOTES
           ============================================
           
           - CSS animations allow elements to transition between styles over time.
           - Two main components: @keyframes rule and animation properties.
           
           Animation Properties:
           - animation-name: refers to the @keyframes name
           - animation-duration: how long the animation takes (e.g., 3s, 500ms)
           - animation-timing-function: speed curve (ease, linear, ease-in, ease-out, ease-in-out)
           - animation-delay: delay before animation starts
           - animation-iteration-count: how many times to repeat (number or infinite)
           - animation-direction: normal, reverse, alternate, alternate-reverse
           - animation-fill-mode: none, forwards, backwards, both
           - animation-play-state: running or paused
           
           Shorthand: animation: name duration timing-function delay iteration-count direction fill-mode;
           
           @keyframes Rule:
           - Defines the animation steps using percentages (0% to 100%) or from/to keywords.
           - Each step can set different CSS property values.
           
           Transitions vs Animations:
           - Transitions: require a trigger (hover, focus), only go from A to B.
           - Animations: can run automatically, support multiple keyframes, looping, etc.
           ============================================ */

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 700px;
            height: 600px;
            background-color: green;
            display: flex;
            align-items: end;
        }
        .ball{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            /* animation shorthand: name | duration | timing-function | iteration-count */
            animation: jump 3s ease-in-out infinite;
        }
        /* @keyframes defines the animation sequence */
        @keyframes jump{
            0%{
                transform: translateY(0); /* start position */
            }
            50%{
                transform: translateY(-200px); /* move up 200px at midpoint */
                background-color: yellow; /* color change at midpoint */
            }
            100%{
                transform: translateY(0); /* return to start */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="ball">IPL</div>
    </div>
    
</body>
</html>
